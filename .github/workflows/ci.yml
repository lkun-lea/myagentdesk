name: Baseline
on: [push, pull_request]

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mad
          POSTGRES_PASSWORD: mad_ci
          POSTGRES_DB: myagentdesk_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U mad -d myagentdesk_test" --health-interval 3s --health-timeout 3s --health-retries 15
    env:
      MAD_TEST_DATABASE_URL: postgresql://mad:mad_ci@127.0.0.1:5432/myagentdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
          enable-cache: true
      - run: npm ci
      - run: npm run build
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_foundation.py -q
