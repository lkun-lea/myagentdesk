services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: myagentdesk
      POSTGRES_USER: mad
      POSTGRES_PASSWORD: mad_dev
    ports:
      - "127.0.0.1:55438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mad -d myagentdesk"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - database:/var/lib/postgresql/data
volumes:
  database:
