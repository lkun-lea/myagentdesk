<section id="myagentdesk-project-pages" aria-label="MyAgentDesk 项目五个子页面的设计预览">

      <div><i data-lucide="calendar-days" aria-hidden="true"></i>日程</div>

  const reqs = {

      states:['已确认','已交接','验收中','待开始'],
      summaries:['同一请求重试沿用原运行；重连可以接着查看进度。','研发已交付候选 r2，改动覆盖请求去重和事件补读。','已通过请求去重与事件补读，正在核对过期游标。','等待同一候选的完整独立验收证据。']},
    takeover:{id:'REQ-031',title:'需求群人工接手',version:'v2',current:0,progress:'待确认',owner:'产品 · 何琪',
      owners:['产品 · 何琪','研发 · 林青','测试 · 周宁','质量 · 赵敏'],
      states:['待决策','待开始','待开始','待开始'],
      summaries:['待确认人工接手后，原 Agent 如何交还未完成的操作。','产品确认范围后可开始实现。','等待固定候选和独立验收计划。','等待测试证据。']}
  };
  const events = [
    {day:'11 月 13 日',rows:[
      {time:'15:10',title:'断线接续进入独立验收',detail:'REQ-024 · 周宁接手 · 候选 r2',label:'交接',action:'req:reconnect:2'},
      {time:'13:40',title:'候选 r2 构建成功',detail:'Build #482 · Windows ZIP · 提交 b81a5f2',label:'构建',action:'build:r2'},
      {time:'11:30',title:'人工接手规则等待产品确认',detail:'REQ-031 · 待决定如何交还未完成操作',label:'待决策',action:'req:takeover:0'}]},
    {day:'11 月 12 日',rows:[
      {time:'16:40',title:'产品确认离线重试规则',detail:'REQ-024 · 需求 v3 · 已记录决定',label:'决策',action:'doc:decision'},
      {time:'14:25',title:'候选 r1 去重用例失败',detail:'REQ-024 · 独立验收 · 已退回研发',label:'返工',action:'req:reconnect:2:evidence:r1'}]}
  ];
  const specs = {
    reconnect:{name:'reconnect-original-run',title:'断线接续原任务',version:'需求 v3',branch:'feat/reconnect-run',commit:'b81a5f2',
      sections:[
        ['proposal.md','问题：手机发送请求后断线，用户无法判断服务端是否已接收。\n范围：恢复原任务，并避免重试产生重复运行。'],
        ['design.md','提交请求携带稳定 request_id。重连后查询原运行并按游标补读事件。'],
        ['specs/session-recovery/spec.md','场景：首次回执丢失\n给定服务端已创建运行\n当客户端用同一请求编号重试\n则返回原 run_id，运行总数为一。'],
        ['tasks.md','[x] 保存稳定请求编号\n[x] 实现事件补读与去重\n[ ] 独立验证过期游标']
      ]},
    takeover:{name:'human-takeover',title:'需求群人工接手',version:'需求 v2 草案',branch:'draft/human-takeover',commit:'d26ea90',
      sections:[
        ['proposal.md','范围：成员可在需求群接手决策，确认后交回给 Agent。'],
        ['design.md','交接使用原运行、阶段和检查点；待产品确认未完成写入的归属。'],
        ['specs/handoff/spec.md','待确认场景：旧执行者结果迟到，如何保留记录并防止覆盖。'],
        ['tasks.md','[ ] 确认未完成动作的处理规则\n[ ] 补齐权限和恢复用例']
      ]},
    reconnectV2:{name:'reconnect-original-run',title:'断线接续 · 初版',version:'需求 v2',branch:'feat/reconnect-run',commit:'4ac91d8',
      archived:true,req:'reconnect',sections:[
        ['proposal.md','初版范围：支持断线后查询运行。'],
        ['design.md','历史方案：只读取当前运行；重试和去重规则待确认。'],
        ['specs/session-recovery/spec.md','历史场景：断线恢复后重新打开已存在的运行。'],
        ['tasks.md','[x] 查询当前运行\n[ ] 补充重试和过期游标规则']
      ]}
  };
  const materials = {
    guide:{title:'项目说明与开发约定',kind:'项目说明',version:'v5',source:'项目资料库 · docs/project-guide.md',access:'项目成员可读',
      body:['桌面端、云端与手机端通过同一个运行编号对齐进展。','开发前确认候选版本。修改后保留验证命令、实际结果和复现入口。']},
    decision:{title:'离线重试规则',kind:'产品决策',version:'v3',source:'REQ-024 需求群 · 11 月 12 日决策记录',access:'需求群成员可读',req:'reconnect',

    plan:{title:'弱网独立验收计划',kind:'测试资料',version:'v2',source:'项目资料库 · qa/reconnect-plan.md',access:'获授权的项目成员可读',req:'reconnect',
      body:['候选 r2 · b81a5f2。依次验证首次回执丢失、重复事件和过期游标。','每个用例记录命令、退出码与原始日志。v1 归档，当前使用 v2。']}

    r2:{number:'#482',version:'0.5.0-rc.2',name:'候选 r2',commit:'b81a5f2',state:'构建成功',tone:'good',passed:true,

      result:'打包阶段中断，未生成可发布产物。保留退出码 1 与打包日志。'}
  };
  const view = {page:'timeline',req:'',stage:2,tab:'summary',evidence:'',spec:'reconnect',file:0,doc:'guide',build:'r2',validated:new Set(['reconnect'])};
  let returnFocus = null;
  const badge = (text,tone='') => '<span class="md-badge" data-tone="' + tone + '">' + text + '</span>';
  const btn = (act,text,primary=false) => '<button type="button" data-action="' + act + '" class="md-action' +

  const top = (title,detail) => '<header class="md-top"><h1>' + title + '</h1><p class="md-muted">' + detail + '</p></header>';
  function line(act,title,detail,extra='',selected) {
    return '<button type="button" class="md-line cursor-interaction" data-action="' + act + '"' +
      (selected === undefined ? '' : ' aria-pressed="' + selected + '"') + '><strong>' + title +
      '</strong><span class="md-muted">' + detail + '</span>' + extra + '</button>';
  }
  function timeline() {
    return top('项目时间线','桌面协作 · 需求、决策、验收与构建') + '<div class="md-layout"><section class="md-panel">' +
      events.map(group => '<div class="md-day"><h3>' + group.day + '</h3>' + group.rows.map(event =>

    return top('需求','从需求列表查看阶段、负责人及交付证据') +

      '</strong><span class="md-muted">' + item.owner + '</span></span>' + badge(item.progress,id === 'takeover' ? 'warn' : '') + '</button>').join('') + '</section>';
  }
  function records(rows,empty) {
    return rows.length ? rows.map(([title,desc,opened]) =>
      '<details class="md-record"' + (opened ? ' open' : '') + '><summary class="cursor-interaction">' + title + '</summary><p class="md-muted">' + desc +
      '</p></details>').join('') : '<p class="md-muted">' + empty + '</p>';
  }
  function stageBody(req) {
    const isReconnect = view.req === 'reconnect';
    if (view.tab === 'summary') return '<p>' + req.summaries[view.stage] + '</p>';
    if (!isReconnect) return '<p class="md-muted">本阶段资料待补充。</p>';
    if (view.tab === 'docs') return '<div class="md-actions">' +
      (view.stage === 0 ? btn('doc:decision','产品确认记录') : view.stage === 1 ? btn('spec:reconnect','OpenSpec 变更') :
        btn('doc:plan','弱网独立验收计划 v2')) + '</div>';
    if (view.tab === 'outputs') return view.stage < 1 ? '<p class="md-muted">尚无构建产物。</p>' : btn('build:r2','候选 r2 · Build #482');
    if (view.stage === 0) return records([['产品确认 · 需求 v3','11 月 12 日已确认同一请求编号重试时使用原运行。']],'尚无证据。');
    if (view.stage === 1) return records([['实现自测 · 已完成','研发提交去重自测记录；独立验收另见对应阶段。']],'尚无证据。');
    if (view.stage === 3) return '<p class="md-muted">待同一候选的完整验收回执。</p>';
    return records([
      ['通过 · 同一请求仅生成一个任务','候选 r2 · 环境 weak-net-02 · 退出码 0。模拟回执丢失后返回原 run_id。',view.evidence === 'r2'],
      ['通过 · 重连按事件序号补读','候选 r2 · 退出码 0。没有重复事件。'],
      ['待运行 · 过期游标恢复','候选 r2。待核对快照水位与补读范围。'],
      ['历史失败 · 候选 r1','旧候选重复创建两个任务，保留首次失败输出。',view.evidence === 'r1']
    ],'尚无证据。');
  }
  function requirement() {
    const req = reqs[view.req];
    if (!req) return requirementList();
    const tabs = [['summary','摘要'],['docs','文档'],['outputs','产物'],['evidence','验收证据']];
    return '<div class="md-inline">' + btn('req-list','← 需求列表') + btn('timeline','项目时间线') + '</div>' +
      top(req.title,req.id + ' · 需求 ' + req.version + ' · 当前阶段：' + stageNames[req.current]) +
      '<div class="md-layout"><section class="md-panel"><div class="md-flex"><h2>需求流程</h2>' + btn('chat','查看需求群') +
      '</div><div class="md-stage" aria-label="需求阶段">' + stageNames.map((name,index) =>
        '<button type="button" class="cursor-interaction" data-stage="' + index + '" aria-pressed="' + (view.stage === index) +
        '"><span>' + name + '</span><span class="md-current">' + req.states[index] + (req.current === index ? ' · 当前' : '') +
        '</span></button>').join('') + '</div><div class="md-flex"><h3>' + stageNames[view.stage] + '</h3><span class="md-muted">' +
        req.owners[view.stage] + '</span></div><div class="md-detail-tabs" aria-label="阶段资料">' + tabs.map(([id,label]) =>
        '<button type="button" class="md-action cursor-interaction" data-detail-tab="' + id + '" aria-pressed="' + (view.tab === id) + '">' +
        label + '</button>').join('') + '</div><div data-stage-body>' + stageBody(req) + '</div></section><aside class="md-panel">' +
      '<h2>Agent 上下文</h2><p class="md-muted">当前阶段带入</p><ul class="md-list"><li>需求 ' + req.version +
      '</li><li>当前验收条件</li><li>阶段职责 · ' + req.owners[view.stage] + '</li></ul><details class="md-divider"><summary class="cursor-interaction">按需读取的资料</summary>' +
      '<div class="md-actions">' + btn('doc:guide','项目说明') + (view.req === 'reconnect' ? btn('doc:decision','离线重试规则') : '') +
      '</div></details></aside></div>';
  }
  function specification() {
    const spec = specs[view.spec];
    const file = spec.sections[view.file];
    const valid = view.validated.has(view.spec);
    const rows = archived => Object.entries(specs).filter(([,item]) => Boolean(item.archived) === archived).map(([id,item]) =>
      line('spec:' + id,item.title,item.name,badge(item.version),id === view.spec)).join('');
    return top('规格','OpenSpec 变更 · 仓库原件与校验记录') + '<div class="md-layout" data-kind="library"><aside class="md-panel"><h2>活动变更</h2>' +
      rows(false) + '<div class="md-divider"><h3>历史归档</h3>' + rows(true) + '</div></aside><section class="md-panel"><div class="md-flex"><h2>' + spec.title + '</h2>' +
      (spec.archived ? badge('历史版本') : badge(valid ? '校验通过' : '待校验',valid ? 'good' : 'warn')) + '</div><p class="md-muted">' + spec.branch + ' · ' + spec.commit +
      '</p><div class="md-detail-tabs" aria-label="规格文件">' + ['提案','设计','行为规格','任务清单'].map((label,index) =>
        '<button type="button" class="md-action cursor-interaction" data-file="' + index + '" aria-pressed="' + (view.file === index) + '">' +
        label + '</button>').join('') + '</div><p class="md-muted">openspec/changes/' + spec.name + '/' + file[0] +
      '</p><pre class="md-file">' + file[1] + '</pre><div class="md-actions">' + (spec.archived ? '' : btn('validate','运行校验',true)) +
      (valid ? btn('validation','查看回执') : '') + btn('req:' + (spec.req || view.spec),'查看关联需求') + '</div></section></div>';
  }
  function library() {
    const doc = materials[view.doc];
    return top('资料','项目说明、产品决策和验收资料') + '<div class="md-layout" data-kind="library"><aside class="md-panel"><h2>资料目录</h2>' +
      Object.entries(materials).map(([id,item]) => line('doc:' + id,item.title,item.kind + ' · ' + item.version,'',id === view.doc)).join('') +
      '</aside><section class="md-panel"><div class="md-flex"><h2>' + doc.title + '</h2>' + badge(doc.version + ' · 当前','good') +
      '</div><p class="md-muted">' + doc.source + ' · ' + doc.access + '</p><div class="md-note">' + doc.body.map(text => '<p>' + text + '</p>').join('') +
      '</div><details class="md-divider"><summary class="cursor-interaction">原件与引用</summary><p class="md-muted">' + doc.source +
      ' · 固定版本 ' + doc.version + ' · Agent 按项目权限读取。</p></details>' +
      (doc.req ? '<div class="md-actions">' + btn('req:' + doc.req,'查看关联需求') + '</div>' : '') + '</section></div>';
  }
  function buildPage() {
    const build = builds[view.build];
    return top('构建与发布','CI 记录、候选产物和发布条件') +
      '<div class="md-layout"><div><section class="md-panel"><h2>构建记录</h2>' + Object.entries(builds).map(([id,item]) =>
        line('build:' + id,item.number + ' · ' + item.name,item.version + ' · 提交 ' + item.commit,badge(item.state,item.tone),id === view.build)).join('') +
      '</section><section class="md-panel"><div class="md-flex"><h2>' + build.number + ' 构建详情</h2>' + badge(build.state,build.tone) +
      '</div><p>' + build.result + '</p><div class="md-actions">' + btn('logs','查看 CI 日志') +
      (build.passed ? btn('artifact','查看 ZIP 与校验摘要') : '') + '</div></section></div><aside><section class="md-panel">' +
      '<h2>发布准备</h2><p class="md-muted">' + build.version + ' · ' + build.commit + '</p><div class="md-divider">' +
      '<div class="md-flex md-gate"><span>候选产物</span>' + badge(build.passed ? '已生成' : '未生成',build.tone) + '</div>' +
      '<div class="md-flex md-gate"><span>独立验收</span>' + badge(build.passed ? '2 / 3 通过' : '历史失败','warn') + '</div>' +
      '<div class="md-flex md-gate"><span>质量放行</span>' + badge('待复核','warn') + '</div>' +
      '<div class="md-flex md-gate"><span>正式发布</span>' + badge('条件未齐','warn') + '</div></div><div class="md-actions">' +
      btn('req:reconnect:2:evidence:' + view.build,'查看验收证据') + btn('release','查看发布条件') + '</div></section>' +
      '<section class="md-panel"><h2>最近正式发布</h2><p><strong>v0.4.2</strong> ' + badge('已发布','good') +
      '</p><p class="md-muted">11 月 8 日 · Windows · 正式渠道</p><div class="md-actions">' + btn('release-history','查看发布回执') + '</div></section></aside></div>';
  }
  function showDialog(title,html) {
    returnFocus = document.activeElement;
    root.querySelector('#md-dialog-title').textContent = title;
    root.querySelector('[data-dialog-body]').innerHTML = html;
    dialog.showModal();
  }
  function render(focus) {
    content.innerHTML = {timeline,requirements:requirement,specs:specification,materials:library,build:buildPage}[view.page]();
    root.querySelectorAll('.md-nav [data-page]').forEach(button => {
      if (button.dataset.page === view.page) button.setAttribute('aria-current','page');
      else button.removeAttribute('aria-current');
    });
    if (focus) content.querySelector(focus)?.focus({preventScroll:true});
    live.textContent = content.querySelector('h1').textContent;
  }
  function navigate(action) {
    const [kind,key,stage,tab,evidence] = action.split(':');
    if (kind === 'req') {
      view.page = 'requirements';
      view.req = key;
      view.stage = stage === undefined ? reqs[key].current : Number(stage);
      view.tab = tab || 'summary';
      view.evidence = evidence || '';
      render('[data-stage="' + view.stage + '"]');
    } else if (kind === 'req-list' || kind === 'timeline') {
      view.page = kind === 'timeline' ? 'timeline' : 'requirements';
      view.req = '';
      render('[data-action]');
    } else if (kind === 'spec') {
      if (view.spec !== key) view.file = 0;
      view.page = 'specs';
      view.spec = key;
      render('[data-action="' + action + '"]');
    } else if (kind === 'doc') {
      view.page = 'materials';
      view.doc = key;
      render('[data-action="' + action + '"]');
    } else if (kind === 'build') {
      view.page = 'build';
      view.build = key;
      render('[data-action="' + action + '"]');
    } else if (kind === 'validate') {
      view.validated.add(view.spec);
      render('[data-action="validation"]');
      live.textContent = '示例规格校验通过，回执已登记';
    } else if (kind === 'validation') {
      const spec = specs[view.spec];
      showDialog('OpenSpec 校验回执','<p>示例校验通过 · 提交 ' + spec.commit + '</p><pre class="md-file">openspec validate ' +
        spec.name + '\n退出码 0 · 文件结构与行为场景检查通过</pre>');
    } else if (kind === 'logs' || kind === 'artifact' || kind === 'release') {
      const build = builds[view.build];
      if (kind === 'logs') showDialog(build.number + ' CI 日志','<pre class="md-file">' + (build.passed ?
        '前端检查  · 退出码 0\n后端回归  · 退出码 0\nWindows 打包 · 退出码 0\n' + build.artifact :
        'Windows 打包 · 退出码 1\n打包步骤未完成，候选产物为空。') + '</pre>');
      else if (kind === 'artifact') showDialog('候选产物与校验摘要','<p>' + build.artifact +
        '</p><p class="md-muted">构建 ' + build.number + ' · 提交 ' + build.commit + '</p><p class="md-note">SHA-256 校验摘要已随候选归档。</p>');
      else showDialog('发布条件','<p>正式发布由获授权的发布负责人确认。</p><ul class="md-list">' +
        (build.passed ? '<li>补齐过期游标用例的验收证据。</li>' : '<li>需要生成有效候选产物。</li>') +
        '<li>质量负责人核对同版本证据并放行。</li></ul>');
    } else if (kind === 'release-history') {
      showDialog('v0.4.2 发布回执','<p>正式渠道 · Windows · 11 月 8 日</p><p class="md-muted">Build #461 · 质量放行已记录 · 发布负责人已确认</p>');
    } else if (kind === 'chat') {
      const req = reqs[view.req];
      showDialog(req.title + ' · 需求群','<p class="md-muted">' + req.id + ' · ' + stageNames[req.current] + '</p><div class="md-note"><p>' +
        req.owner + ' · ' + req.summaries[req.current] + '</p></div>');
    }
  }
  root.addEventListener('click',event => {
    const button = event.target.closest('button');
    if (!button || !root.contains(button)) return;
    const data = button.dataset;
    if (button.hasAttribute('data-close')) dialog.close();
    else if (data.page) {
      view.page = data.page;
      if (view.page === 'requirements') view.req = '';
      render();
    } else if (data.stage !== undefined) {
      view.stage = Number(data.stage);
      view.tab = 'summary';
      view.evidence = '';
      render('[data-stage="' + data.stage + '"]');
    } else if (data.detailTab) {
      view.tab = data.detailTab;
      render('[data-detail-tab="' + data.detailTab + '"]');
    } else if (data.file !== undefined) {
      view.file = Number(data.file);
      render('[data-file="' + data.file + '"]');
    } else if (data.action) navigate(data.action);
  });
  dialog.addEventListener('close',() => {
    if (returnFocus?.isConnected) returnFocus.focus();
  });
  render();
})();
</script>
