<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyAgentDesk · 版本时间线草图</title>
<style>html{color-scheme:light dark}body{margin:0}</style>
</head>
<body>
<section id="mad-release-timeline" aria-label="MyAgentDesk 版本时间线设计">
  <div class="rt-app">
    <aside class="rt-rail" aria-label="全局导航示意">
      <div class="rt-brand"><b>m.</b> MyAgentDesk</div>
      <div><i data-lucide="layout-grid" aria-hidden="true"></i> 工作台</div>
      <div aria-current="location"><i data-lucide="folders" aria-hidden="true"></i> 项目</div>
      <div><i data-lucide="messages-square" aria-hidden="true"></i> 聊天</div>
    </aside>
    <main class="rt-main">
      <header class="rt-top"><p>项目 / <strong>桌面协作</strong></p><span class="rt-muted">设计预览 · 示例数据</span></header>
      <nav class="rt-nav" aria-label="项目子页面示意"><span aria-current="page">时间线</span><span>需求</span><span>规格</span><span>资料</span><span>Issues</span><span>构建与发布</span></nav>
      <div class="rt-content">
        <div class="rt-heading">
          <div><h1>版本时间线</h1><p class="rt-muted">11 月 9 日 – 12 月 14 日</p></div>
          <label class="rt-role">演示视角 <select data-role><option value="member">项目成员</option><option value="owner">项目负责人</option></select></label>
        </div>
        <section class="rt-roadmap" aria-label="按版本排列的发布计划" data-roadmap></section>
        <div class="rt-detail" data-detail></div>
        <p class="rt-sr" role="status" data-live></p>
      </div>
    </main>
  </div>
  <dialog aria-labelledby="rt-dialog-title" class="rt-dialog">
    <div class="rt-between"><h2 id="rt-dialog-title">调整版本发布日期</h2><button type="button" class="rt-button cursor-interaction" data-cancel>取消</button></div>
    <p data-dialog-summary class="rt-muted"></p>
    <div class="rt-fields">
      <label>目标发布日期<input type="date" min="2026-11-13" max="2026-12-14" data-date required></label>
      <label>调整原因<textarea rows="2" data-reason required placeholder="例如：为弱网复跑预留时间"></textarea></label>
      <p data-error role="alert" class="rt-error"></p>
    </div>
    <button type="button" class="rt-button rt-primary cursor-interaction" data-confirm>确认调整并通知项目成员</button>
  </dialog>
</section>
<style>
  #mad-release-timeline {
    --rt-base:light-dark(#f7f9fc,#11161e);--rt-rail:light-dark(#eaf0f8,#1a202a);
    --rt-panel:light-dark(#fff,#1b2431);--rt-fill:light-dark(#edf3f9,#253143);
    --rt-ink:light-dark(#1a2940,#eaf1fc);--rt-muted:light-dark(#52637a,#aabbd1);--rt-line:light-dark(#dce5f0,#364458);
    --rt-blue:light-dark(#2459aa,#a9c6ff);--rt-blue-bg:light-dark(#e7efff,#2a4169);
    --rt-green:light-dark(#12634d,#93dcca);--rt-green-bg:light-dark(#dff2e9,#213d35);
    --rt-warn:light-dark(#865315,#f4ca92);--rt-warn-bg:light-dark(#faedd9,#473521);
    --rt-action:light-dark(#2459aa,#b4ceff);--rt-on-action:light-dark(#fff,#142744);
    color-scheme:light dark;color:var(--rt-ink);font:14px/1.45 Inter,"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;font-variant-numeric:tabular-nums
  }
  #mad-release-timeline *,#mad-release-timeline *::before,#mad-release-timeline *::after {box-sizing:border-box}
  #mad-release-timeline :is(h1,h2,h3,p,ol) {margin:0;overflow-wrap:anywhere}
  #mad-release-timeline h1 {font-size:25px;letter-spacing:-.03em;line-height:1.2}
  #mad-release-timeline h2 {font-size:16px;font-weight:650}
  #mad-release-timeline h3 {font-size:13px;font-weight:620}
  #mad-release-timeline :is(button,select,input,textarea) {color:inherit;font:inherit;min-width:0}
  #mad-release-timeline button {border:0;border-radius:7px;background:transparent;text-align:left}
  #mad-release-timeline :is(button,select,input,textarea,summary):focus-visible {outline:2px solid var(--rt-blue);outline-offset:2px}
  #mad-release-timeline :is([data-lucide],svg.lucide) {width:16px;height:16px;flex:0 0 16px;vertical-align:-.13em}
  #mad-release-timeline .rt-app {display:grid;grid-template-columns:130px minmax(0,1fr);background:var(--rt-rail);border-radius:15px;overflow:hidden}
  #mad-release-timeline .rt-rail {padding:14px 8px}
  #mad-release-timeline .rt-rail>div {display:flex;align-items:center;gap:6px;padding:7px 6px;font-size:12px;color:var(--rt-muted)}
  #mad-release-timeline .rt-rail .rt-brand {font-weight:660;color:var(--rt-ink);margin-bottom:10px}
  #mad-release-timeline .rt-brand b {background:var(--rt-blue-bg);color:var(--rt-blue);display:grid;place-items:center;width:23px;height:23px;border-radius:7px;flex:none;font-size:15px}
  #mad-release-timeline .rt-rail [aria-current] {color:var(--rt-blue);background:var(--rt-panel);border-radius:7px;font-weight:620}
  #mad-release-timeline .rt-main {min-width:0;background:var(--rt-base)}
  #mad-release-timeline .rt-top {display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 16px 6px}
  #mad-release-timeline .rt-nav {display:flex;flex-wrap:wrap;gap:0 13px;padding:0 16px;border-bottom:1px solid var(--rt-line);color:var(--rt-muted);font-size:13px}
  #mad-release-timeline .rt-nav span {padding:6px 1px;border-bottom:2px solid transparent}
  #mad-release-timeline .rt-nav [aria-current] {color:var(--rt-blue);border-color:currentColor;font-weight:620}
  #mad-release-timeline .rt-content {padding:15px 16px;min-width:0}
  #mad-release-timeline :is(.rt-heading,.rt-between) {display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 12px}
  #mad-release-timeline .rt-heading {margin-bottom:12px}
  #mad-release-timeline .rt-heading p {margin-top:4px}
  #mad-release-timeline :is(.rt-muted,.rt-role) {font-size:12px;color:var(--rt-muted)}
  #mad-release-timeline .rt-role {display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  #mad-release-timeline :is(select,input,textarea) {padding:5px 7px;background:var(--rt-base);border:1px solid var(--rt-line);border-radius:7px;max-width:100%}
  #mad-release-timeline :is(.rt-roadmap,.rt-panel) {background:var(--rt-panel);padding:11px;border-radius:11px;min-width:0}
  #mad-release-timeline .rt-row {display:grid;grid-template-columns:135px minmax(0,1fr);gap:9px;align-items:center}
  #mad-release-timeline .rt-row+.rt-row {border-top:1px solid var(--rt-line)}
  #mad-release-timeline .rt-axis {position:relative;height:32px;margin-inline:14px}
  #mad-release-timeline .rt-axis time {position:absolute;left:var(--x);transform:translateX(-50%);color:var(--rt-muted);font-size:11px;white-space:nowrap}
  #mad-release-timeline .rt-version {display:grid;gap:3px;width:100%;padding:6px;overflow-wrap:anywhere}
  #mad-release-timeline .rt-version[aria-pressed=true] {background:var(--rt-blue-bg);color:var(--rt-blue)}
  #mad-release-timeline .rt-track {position:relative;min-height:57px;margin-inline:14px}
  #mad-release-timeline .rt-grid {position:absolute;inset:0;pointer-events:none}
  #mad-release-timeline .rt-grid i {position:absolute;inset-block:0;left:var(--x);width:1px;background:var(--rt-line)}
  #mad-release-timeline .rt-grid .rt-now {background:var(--rt-blue);opacity:.54}
  #mad-release-timeline .rt-span {position:absolute;left:var(--start);width:calc(var(--end) - var(--start));top:25px;height:8px;border-radius:5px;background:var(--rt-blue-bg)}
  #mad-release-timeline .rt-track[data-tone="good"] .rt-span {background:var(--rt-green-bg)}
  #mad-release-timeline .rt-track[data-tone="warn"] .rt-span {background:var(--rt-warn-bg)}
  #mad-release-timeline .rt-point {display:contents}
  #mad-release-timeline .rt-milestone {position:absolute;left:var(--x);top:17px;transform:translateX(-50%);width:24px;height:24px;display:grid;place-items:center;padding:0;background:var(--rt-panel);color:var(--rt-blue);border:1px solid var(--rt-blue)}
  #mad-release-timeline .rt-milestone[aria-pressed=true] {background:var(--rt-action);color:var(--rt-on-action)}
  #mad-release-timeline .rt-marker-date {position:absolute;left:var(--x);top:40px;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:var(--rt-muted)}
  #mad-release-timeline .rt-marker-date .rt-mark-label {display:none}
  #mad-release-timeline .rt-key {display:flex;gap:5px 14px;flex-wrap:wrap;margin-top:8px}
  #mad-release-timeline .rt-key span::before {content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rt-blue);margin-right:5px}
  #mad-release-timeline .rt-key span:nth-child(2)::before {background:var(--rt-green)}
  #mad-release-timeline .rt-detail {display:grid;grid-template-columns:minmax(0,1.48fr) minmax(0,1fr);gap:8px;margin-top:9px}
  #mad-release-timeline .rt-detail>* {min-width:0}
  #mad-release-timeline .rt-panel h2 {margin-bottom:6px}
  #mad-release-timeline .rt-panel .rt-between h2 {margin:0}
  #mad-release-timeline .rt-panel p {margin-top:4px}
  #mad-release-timeline .rt-chip {padding:2px 6px;width:max-content;max-width:100%;border-radius:5px;background:var(--rt-blue-bg);color:var(--rt-blue);font-size:11px}
  #mad-release-timeline .rt-chip[data-tone="good"] {background:var(--rt-green-bg);color:var(--rt-green)}
  #mad-release-timeline .rt-chip[data-tone="warn"] {background:var(--rt-warn-bg);color:var(--rt-warn)}
  #mad-release-timeline .rt-button {padding:5px 7px;color:var(--rt-blue);font-size:12px}
  #mad-release-timeline .rt-button:hover {background:var(--rt-fill)}
  #mad-release-timeline .rt-primary {background:var(--rt-action);color:var(--rt-on-action)}
  #mad-release-timeline .rt-primary:hover {background:var(--rt-action);opacity:.88}
  #mad-release-timeline .rt-links {display:grid;gap:4px;margin-top:7px}
  #mad-release-timeline .rt-links details {border-top:1px solid var(--rt-line);padding-top:5px}
  #mad-release-timeline .rt-links summary {color:var(--rt-blue);font-size:12px}
  #mad-release-timeline .rt-log {list-style:none;padding:0;display:grid;gap:7px;margin-top:7px}
  #mad-release-timeline .rt-log li {padding:5px 7px;background:var(--rt-fill);border-radius:6px;font-size:12px;overflow-wrap:anywhere}
  #mad-release-timeline .rt-dialog {width:min(420px,calc(100% - 22px));max-height:calc(100% - 18px);padding:14px;border:1px solid var(--rt-line);border-radius:10px;background:var(--rt-panel);color:var(--rt-ink)}
  #mad-release-timeline .rt-dialog::backdrop {background:rgb(7 16 31 / .43)}
  #mad-release-timeline .rt-fields {display:grid;gap:7px;margin:9px 0}
  #mad-release-timeline .rt-fields label {display:grid;gap:4px;font-size:12px}
  #mad-release-timeline .rt-error {font-size:12px;color:var(--rt-warn)}
  #mad-release-timeline .rt-sr {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  @media(max-width:680px) {
    #mad-release-timeline .rt-app {grid-template-columns:minmax(0,1fr)}
    #mad-release-timeline .rt-rail {display:flex;align-items:center;flex-wrap:wrap;padding:5px 8px}
    #mad-release-timeline .rt-rail .rt-brand {margin:0}
  }
  @media(max-width:535px) {
    #mad-release-timeline .rt-content {padding:11px}
    #mad-release-timeline .rt-detail {grid-template-columns:minmax(0,1fr)}
    #mad-release-timeline .rt-row {grid-template-columns:minmax(0,1fr);padding:4px 0;gap:3px}
    #mad-release-timeline .rt-axis-row,#mad-release-timeline .rt-grid,#mad-release-timeline .rt-span {display:none}
    #mad-release-timeline .rt-track {display:grid;gap:3px;margin:0 4px;min-height:0}
    #mad-release-timeline .rt-point {display:flex;align-items:center;gap:7px;width:max-content;max-width:100%}
    #mad-release-timeline :is(.rt-milestone,.rt-marker-date) {position:static;transform:none}
    #mad-release-timeline .rt-marker-date .rt-mark-label {display:inline}
    #mad-release-timeline .rt-nav {gap:0 8px;padding-inline:10px}
  }
  @media(pointer:coarse) {
    #mad-release-timeline button:not(.rt-milestone) {min-height:44px}
    #mad-release-timeline .rt-milestone::after {content:'';position:absolute;inset:-9px}
    #mad-release-timeline .rt-track {row-gap:18px}
    #mad-release-timeline :is(select,input,textarea) {font-size:16px}
  }
  @media(pointer:coarse) and (max-width:535px) {
    #mad-release-timeline .rt-track {row-gap:3px}
    #mad-release-timeline .rt-milestone {width:44px;min-height:44px}
    #mad-release-timeline .rt-milestone::after {display:none}
  }
</style>
<script>
(() => {
  const root = document.getElementById('mad-release-timeline');
  const board = root.querySelector('[data-roadmap]');
  const detail = root.querySelector('[data-detail]');
  const live = root.querySelector('[data-live]');
  const dialog = root.querySelector('dialog');
  const role = root.querySelector('[data-role]');
  const versions = [
    {id:'v0.4.2',title:'基础工作台',start:'2026-11-09',gate:'2026-11-10',target:'2026-11-12',actual:'2026-11-12',state:'已发布',tone:'good',
      progress:'首版项目页已发布。',scope:'项目导航、资料目录与独立日程。',gateTitle:'质量放行',gateNote:'当前候选的独立验收已通过，质量负责人已签收。'},
    {id:'v0.5.0',title:'需求协作与接续',start:'2026-11-11',gate:'2026-11-18',target:'2026-11-20',state:'有风险',tone:'warn',
      progress:'3 项需求中 2 项已验收，1 项待验证。',scope:'需求群、任务接续与验收证据。',gateTitle:'独立验收',gateNote:'弱网复跑缺少可用环境。测试负责人周宁跟进，目标 11 月 18 日完成。'},
    {id:'v0.6.0',title:'本机执行联动',start:'2026-11-23',gate:'2026-12-02',target:'2026-12-04',state:'计划中',tone:'blue',
      progress:'待启动。依赖 v0.5.0 的需求阶段和验收契约。',scope:'tebb 派发与回执、Codex 编码执行器。',gateTitle:'联调验收',gateNote:'待验证断网补传、重复派发及候选复跑。'}
  ];
  const today = '2026-11-13';
  const epoch = Date.parse('2026-11-09');
  const ticks = ['2026-11-09','2026-11-16','2026-11-23','2026-11-30','2026-12-07','2026-12-14'];
  const pct = date => ((Date.parse(date)-epoch)/86400000/35*100).toFixed(3)+'%';
  const short = date => Number(date.slice(5,7))+'/'+Number(date.slice(8,10));
  const escape = value => value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const tag = (label,tone) => '<span class="rt-chip" data-tone="'+tone+'">'+label+'</span>';
  let selected = 'v0.5.0', mark = 'gate';
  const decisions = {'v0.5.0':[{title:'保留当前版本范围',note:'项目负责人 · 11/13。弱网验收结果齐备后安排发布。'}]};
  const current = () => versions.find(version=>version.id===selected);
  const marker = (version,kind,date,label) => '<div class="rt-point"><button type="button" class="rt-milestone cursor-interaction" data-select="'+version.id+
    '" data-mark="'+kind+'" style="--x:'+pct(date)+'" aria-pressed="'+(selected===version.id&&mark===kind)+
    '" aria-label="'+version.id+' '+label+' '+short(date)+'">'+(kind==='gate'?'◆':version.actual?'✓':'○')+
    '</button><span class="rt-marker-date" style="--x:'+pct(date)+'"><span class="rt-mark-label">'+label+' · </span>'+short(date)+'</span></div>';
  function roadmap() {
    const grid = '<div class="rt-grid" aria-hidden="true">'+ticks.map(date=>'<i style="--x:'+pct(date)+'"></i>').join('')+
      '<i class="rt-now" style="--x:'+pct(today)+'"></i></div>';
    board.innerHTML = '<div class="rt-row rt-axis-row"><p class="rt-muted">发布版本</p><div class="rt-axis">'+
      ticks.map(date=>'<time datetime="'+date+'" style="--x:'+pct(date)+'">'+short(date)+'</time>').join('')+'</div></div>'+
      versions.map(version=>'<div class="rt-row"><button type="button" class="rt-version cursor-interaction" data-select="'+version.id+
      '" data-mark="gate" aria-pressed="'+(selected===version.id)+'"><strong>'+version.id+' · '+version.title+'</strong>'+
      tag(version.state,version.tone)+'</button><div class="rt-track" data-tone="'+version.tone+'">'+grid+
      '<div class="rt-span" style="--start:'+pct(version.start)+';--end:'+pct(version.actual||version.target)+'"></div>'+
      marker(version,'gate',version.gate,version.gateTitle)+marker(version,'release',version.actual||version.target,version.actual?'实际发布':'目标发布')+
      '</div></div>').join('')+'<div class="rt-key rt-muted"><span>今天 '+short(today)+'</span><span>已发布版本</span>◆ 验收里程碑　○ 目标发布　✓ 实际发布</div>';
  }
  function panel() {
    const version = current();
    const release = mark==='release';
    const logs = decisions[selected]||[];
    const focus = release ? (version.actual ? '已发布，可在构建与发布查看正式回执。' : '目标日期由项目负责人维护。实际发布以质量放行和发布回执为准。') : version.gateNote;
    detail.innerHTML = '<section class="rt-panel"><div class="rt-between"><h2>'+version.id+' · '+version.title+'</h2>'+tag(version.state,version.tone)+
      '</div><p class="rt-muted">目标发布 '+short(version.target)+(version.actual?' · 实际发布 '+short(version.actual):' · '+version.progress)+'</p>'+
      '<p><strong>'+(release?'发布节点':version.gateTitle)+'</strong> · '+focus+'</p>'+
      '<div class="rt-links"><details><summary class="cursor-interaction">版本范围与需求</summary><p>'+version.scope+'</p></details>'+
      '<details><summary class="cursor-interaction">验收、构建与发布记录</summary><p>'+version.gateNote+
      '</p><p class="rt-muted">'+(version.actual?'正式发布回执 · Build #461':'版本尚未发布。')+'</p></details></div></section>'+
      '<aside class="rt-panel"><div class="rt-between"><h2>版本决策</h2>'+
      (role.value==='owner'&&!version.actual?'<button type="button" class="rt-button cursor-interaction" data-adjust>调整目标日期</button>':'')+'</div>'+
      (logs.length?'<ol class="rt-log">'+logs.map(log=>'<li><strong>'+log.title+'</strong><p>'+escape(log.note)+'</p></li>').join('')+'</ol>':
      '<p class="rt-muted">暂无调整记录。</p>')+'</aside>';
  }
  function paint() {roadmap();panel();}
  root.addEventListener('click',event=>{
    const button = event.target.closest('button');
    if (!button||!root.contains(button)) return;
    if (button.dataset.select) {
      const versionButton = button.classList.contains('rt-version');
      selected=button.dataset.select;
      mark=button.dataset.mark;
      paint();
      const selector=(versionButton?'.rt-version':'.rt-milestone')+'[data-select="'+selected+'"][data-mark="'+mark+'"]';
      board.querySelector(selector)?.focus({preventScroll:true});
      live.textContent=selected+' · '+(mark==='gate'?current().gateTitle:'发布节点');
    } else if (button.hasAttribute('data-adjust')) {
      const version=current();
      root.querySelector('[data-dialog-summary]').textContent=version.id+' · 当前目标 '+short(version.target);
      root.querySelector('[data-date]').value=version.target;
      root.querySelector('[data-date]').min=version.gate;
      root.querySelector('[data-reason]').value='';
      root.querySelector('[data-error]').textContent='';
      dialog.showModal();
    } else if (button.hasAttribute('data-cancel')) {
      dialog.close();
    } else if (button.hasAttribute('data-confirm')&&dialog.open&&role.value==='owner') {
      const version=current();
      const date=root.querySelector('[data-date]');
      const reason=root.querySelector('[data-reason]').value.trim();
      if (!date.checkValidity()||!reason||date.value===version.target) {
        root.querySelector('[data-error]').textContent='请选择验收里程碑当天或之后的新日期，并填写调整原因。';
        return;
      }
      const old=version.target;
      version.target=date.value;
      decisions[selected]=[{title:'目标发布日期 '+short(old)+' → '+short(version.target),note:'项目负责人 · '+reason},...(decisions[selected]||[])];
      dialog.close();
      mark='release';
      paint();
      detail.querySelector('[data-adjust]').focus({preventScroll:true});
      live.textContent='已更新版本目标日期，示例通知已登记';
    }
  });
  role.addEventListener('change',panel);
  paint();
})();
</script>

</body>
</html>
