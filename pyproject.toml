[project]
name = "myagentdesk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=45,<50",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
